type TocEntry {
    # Many-to-one: TocEntry belongs to ToC
    toc: ToC

    # Unique key for replace-set identity (toc_id:generation:sort_order).
    # Generation avoids reusing Defra tombstoned IDs after extraction reset.
    unique_key: String

    # Core fields
    entry_number: String
    title: String
    level: Int
    level_name: String

    # Page references (optional link to actual page)
    printed_page_number: String
    actual_page: Page

    # Durable per-entry link budget. A failed entry remains visibly skipped
    # across process restarts until an explicit toc_link reset clears it.
    link_retries: Int
    link_failed: Boolean
    link_failure_reason: String
    link_failed_at: DateTime

    # Source tracking
    source: String

    # Ordering
    sort_order: Int
}
