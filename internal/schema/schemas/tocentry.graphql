type TocEntry {
    # Many-to-one: TocEntry belongs to ToC
    toc: ToC

    # Unique key for replace-set identity (toc_id:generation:sort_order).
    # Generation avoids reusing Defra tombstoned IDs after extraction reset.
    unique_key: String

    # Core fields
    entry_number: String
    title: String
    level: Int
    level_name: String

    # Page references (optional link to actual page)
    printed_page_number: String
    actual_page: Page

    # Source tracking
    source: String

    # Ordering
    sort_order: Int
}
